}

@keyframes flicker {
  0%, 90%, 100% { opacity: 1; }
  92%, 96% { opacity: .15; }
}

@keyframes glitch {
  0%, 93%, 100% {
    transform: translate(0);
  }
  94% {
    transform: translate(-5px, 2px);
  }
  95% {
    transform: translate(5px, -2px);
  }
  96% {
    transform: translate(-3px, 0);
  }

@keyframes load {
  from { width: 0%; }
  to { width: 100%; }
}

<script>
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

let drops = [];
const fontSize = 15;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  drops = Array(
    Math.ceil(canvas.width / fontSize)
  ).fill(1);
}

resize();

window.addEventListener("resize", resize);

function drawMatrix() {
  ctx.fillStyle = "rgba(0,0,0,0.07)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#00ff66";
  ctx.font = fontSize + "px monospace";

  drops.forEach((y, i) => {
    const chars = "01ABCDEF#$@%";

    const char = chars[
      Math.floor(Math.random() * chars.length)
    ];

    ctx.fillText(
      char,
      i * fontSize,
      y * fontSize
    );

    if (
      y * fontSize > canvas.height &&
      Math.random() > .975
    ) {
      drops[i] = 0;
    }

    drops[i]++;
  });
}

function createFloatingData() {

    if (type === 0) {
        const user = unknownUsers[

        ];

            "TRACE FAILED",
            "SIGNAL LOST",
            "IDENTITY UNKNOWN",
            "ENCRYPTED NODE",
            "CONNECTION TERMINATED"
        ];

        item.textContent = alerts[

        ];

        item.classList.add("danger");
    }

}

let activeUsers = 1248;

  );

    tracedIPs.toLocaleString();

const connectionCanvas =
  document.getElementById("connectionCanvas");

const connectionCtx =
  connectionCanvas.getContext("2d");

let networkNodes = [];

function resizeConnections() {
  connectionCanvas.width = window.innerWidth;
  connectionCanvas.height = window.innerHeight;

  networkNodes = Array.from({ length: 25 }, () => ({
    x: Math.random() * connectionCanvas.width,
    y: Math.random() * connectionCanvas.height,
    vx: (Math.random() - 0.5) * 0.6,
    vy: (Math.random() - 0.5) * 0.6
  }));
}

resizeConnections();

window.addEventListener("resize", resizeConnections);

function animateConnections() {
  const w = connectionCanvas.width;
  const h = connectionCanvas.height;

  connectionCtx.clearRect(0, 0, w, h);

  networkNodes.forEach((node, i) => {
    node.x += node.vx;
    node.y += node.vy;

    if (node.x < 0 || node.x > w) node.vx *= -1;
    if (node.y < 0 || node.y > h) node.vy *= -1;

    connectionCtx.fillStyle = "#00ff66";
    connectionCtx.beginPath();
    connectionCtx.arc(node.x, node.y, 2, 0, Math.PI * 2);
    connectionCtx.fill();

    for (let j = i + 1; j < networkNodes.length; j++) {
      const other = networkNodes[j];
      const distance = Math.hypot(
        node.x - other.x,
        node.y - other.y
      );

      if (distance < 200) {
        connectionCtx.strokeStyle =
          `rgba(0,255,102,${1 - distance / 200})`;

        connectionCtx.lineWidth = 0.7;
        connectionCtx.beginPath();
        connectionCtx.moveTo(node.x, node.y);
        connectionCtx.lineTo(other.x, other.y);
        connectionCtx.stroke();
      }
    }
  });

  requestAnimationFrame(animateConnections);
}

animateConnections();
